[project]
name = "prithvi-eo-feature-extraction-pipeline"
version = "0.1.0"
description = "DIMER pipeline for Prithvi-EO-2.0-300M (ibm-nasa-geospatial/Prithvi-EO-2.0-300M): token and scene embeddings of HLS reflectance stacks, masked reconstruction against a mean-fill baseline, and a bounded linear probe on frozen token embeddings with a portable adapter"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Kurt Valcorza" }]
dependencies = [
  # The upstream checkpoint is a torch pickle; this package converts it once into safetensors (docs/WEIGHTS.md)
  # and builds the masked autoencoder from the terratorch package on PyPI (which brings torchgeo, lightning, timm,
  # segmentation-models-pytorch, albumentations, rasterio and their dependencies). tifffile reads the chips;
  # torchvision is pinned beside torch because the import chain reaches it.
  "torch==2.14.0",
  "torchvision==0.29.0",
  "terratorch==1.2.13",
  "tifffile==2026.9.15",
  "numpy==2.5.3",
  "safetensors==0.8.0",
  "huggingface-hub==1.32.0",
]
[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.16.6"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/prithvi_eo_feature_extraction_pipeline"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["tutorials"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
